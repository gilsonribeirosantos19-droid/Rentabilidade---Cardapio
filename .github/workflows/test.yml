name: Testes

# Roda os testes a cada push e pull request. O GitHub mostra ✓ verde (passou) ou ✗ vermelho
# (quebrou) do lado de cada commit. Dois jobs em paralelo:
#   • test  → unitários do coração (custo médio / CMV / ficha + pró-rata / moeda / datas / CSV / fiscal)
#   • e2e   → smoke test no navegador (o app sobe sem tela branca + tela de login aparece)

on:
  push:
  pull_request:

jobs:
  test:
    name: Testes do coração (custo médio / CMV)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes
        run: npm test

  e2e:
    name: Smoke test (navegador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # URL pública do Supabase + chave PLACEHOLDER (o smoke só abre a tela de login, não faz
    # requisição). NÃO são segredo. Testes COM login (degrau 2) usarão GitHub Secrets.
    env:
      VITE_SUPA_URL: https://trczpnjidqfippbfxtpe.supabase.co
      VITE_SUPA_KEY: sb_publishable_PLACEHOLDER_CI_SMOKE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Rodar e2e (smoke)
        run: npm run e2e
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
