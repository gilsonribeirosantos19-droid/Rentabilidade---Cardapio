name: Testes

# Roda os testes a cada push e pull request. O GitHub mostra ✓ verde (passou) ou ✗ vermelho
# (quebrou) do lado de cada commit. Dois jobs em paralelo:
#   • test  → unitários do coração (custo médio / CMV / ficha + pró-rata / moeda / datas / CSV / fiscal)
#   • e2e   → smoke test no navegador (o app sobe sem tela branca + tela de login aparece)

on:
  push:
  pull_request:

jobs:
  test:
    name: Testes do coração (custo médio / CMV)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Rodar testes
        run: npm test

  e2e:
    name: Smoke test (navegador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    # URL + chave PUBLISHABLE do Supabase são PÚBLICAS (já vão no bundle do front / repo).
    # A senha do robô é SECRET: sem os 2 secrets E2E_EMAIL/E2E_SENHA, os testes COM login
    # (login, navegação, paridade) se PULAM sozinhos e só o smoke roda — CI continua verde.
    # Pra ativá-los: Settings > Secrets and variables > Actions > New repository secret:
    #   E2E_EMAIL = e2e@teste.aiko     E2E_SENHA = (a senha do robô)
    env:
      VITE_SUPA_URL: https://trczpnjidqfippbfxtpe.supabase.co
      VITE_SUPA_KEY: sb_publishable_GJqQ_qWVg5Y8GWaKy1qe7w_VvZiIQ3i
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_SENHA: ${{ secrets.E2E_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Rodar e2e (smoke)
        run: npm run e2e
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7
